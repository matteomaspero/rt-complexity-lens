name: Publish Python package to PyPI

# Triggers on version tags (e.g. v1.2.0, v1.3.0-rc1) or manual dispatch.
# Uses PyPI Trusted Publishing (OIDC) — no API token stored in the repo.
# Configure the trusted publisher at:
#   https://pypi.org/manage/account/publishing/
#   Project: rtplan-complexity
#   Workflow: .github/workflows/publish-python.yml
#   Environment: pypi

on:
  push:
    tags:
      - "python-v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Publishing target"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Build distributions
        run: python -m build
      - name: Verify metadata with twine
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: python/dist/*

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/rtplan-complexity/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: >
      startsWith(github.ref, 'refs/tags/python-v') ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/rtplan-complexity/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
